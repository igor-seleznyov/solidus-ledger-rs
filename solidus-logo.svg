<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#0A1628"/>
  <!-- Coin -->
  <g transform="translate(100, 100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#C9A961" stroke-width="2"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#C9A961" stroke-width="1" opacity="0.5"/>
    <!-- Notches around the edge - hint at blocks/entries -->
    <g fill="#C9A961">
      <circle cx="0" cy="-55" r="1.5"/>
      <circle cx="19" cy="-51.6" r="1.5"/>
      <circle cx="35.4" cy="-42.1" r="1.5"/>
      <circle cx="47.6" cy="-27.5" r="1.5"/>
      <circle cx="54.2" cy="-9.5" r="1.5"/>
      <circle cx="54.2" cy="9.5" r="1.5"/>
      <circle cx="47.6" cy="27.5" r="1.5"/>
      <circle cx="35.4" cy="42.1" r="1.5"/>
      <circle cx="19" cy="51.6" r="1.5"/>
      <circle cx="0" cy="55" r="1.5"/>
      <circle cx="-19" cy="51.6" r="1.5"/>
      <circle cx="-35.4" cy="42.1" r="1.5"/>
      <circle cx="-47.6" cy="27.5" r="1.5"/>
      <circle cx="-54.2" cy="9.5" r="1.5"/>
      <circle cx="-54.2" cy="-9.5" r="1.5"/>
      <circle cx="-47.6" cy="-27.5" r="1.5"/>
      <circle cx="-35.4" cy="-42.1" r="1.5"/>
      <circle cx="-19" cy="-51.6" r="1.5"/>
    </g>
    <!-- Double bar (debit = credit) in center -->
    <rect x="-26" y="-6" width="52" height="3" fill="#C9A961"/>
    <rect x="-26" y="3" width="52" height="3" fill="#C9A961"/>
    <!-- Small S engraving above -->
    <text x="0" y="-22" font-family="Gelasio, Georgia, serif" font-size="20" fill="#C9A961" text-anchor="middle" font-weight="bold">S</text>
    <!-- L below -->
    <text x="0" y="36" font-family="Gelasio, Georgia, serif" font-size="20" fill="#C9A961" text-anchor="middle" font-weight="bold">L</text>
  </g>
  <!-- Wordmark -->
  <text x="190" y="95" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#F5F5F0" font-weight="600" letter-spacing="1">SOLIDUS</text>
  <text x="190" y="125" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#C9A961" font-weight="300" letter-spacing="6">LEDGER</text>
</svg>
