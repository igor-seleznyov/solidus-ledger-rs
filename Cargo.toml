[package]
name = "solidus-ledger-rs"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[workspace]
members = [
    "crates/common",
    "crates/config",
    "crates/ledger",
    "crates/net",
    "crates/pipeline",
    "crates/protocol",
    "crates/ringbuf",
    "crates/storage",
    "crates/integration_tests"
]

[workspace.dependencies]
mio = { version = "1.1.1", features = ["os-poll", "os-ext", "net"]}
libc = { version = "0.2.186" }
uuid = { version = "1.23.4", features = ["serde"] }
io-uring = "0.7.13"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
sha2 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
thiserror = "2.0.18"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"

[dependencies]
mio.workspace = true
net = { path = "crates/net" }
libc.workspace = true
uuid.workspace = true
ed25519-dalek.workspace = true
protocol = { path = "crates/protocol" }
common = { path = "crates/common" }
config = { path = "crates/config" }
pipeline = { path = "crates/pipeline" }
ringbuf = { path = "crates/ringbuf" }
ledger = { path = "crates/ledger" }
storage = { path = "crates/storage" }
integration_tests = { path = "crates/integration_tests" }
sha2.workspace = true
chrono.workspace = true
thiserror.workspace = true

[[bin]]
name = "rust-start"
path = "src/main.rs"